<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прокси США</title>
<style>
:root{--neon:#39ff88;--neon-d:#1fd46c;--cyan:#4fc3f7;--red:#ff4d4f;--amber:#ffc048;--bg:rgba(7,13,10,.90);--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#e8f5ec;--mut:#8fa598;--glow:0 0 6px rgba(57,255,136,.85),0 0 22px rgba(57,255,136,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;color:var(--txt);font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;font-size:13px;user-select:none;overflow:hidden}
.app{height:100%;background:var(--bg);border:1px solid rgba(57,255,136,.18);border-radius:14px;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 14px}.bar .t{flex:1;font-weight:600;letter-spacing:.2px}
.wb{width:30px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--mut);font-size:15px;cursor:pointer}.wb:hover{background:rgba(255,255,255,.08);color:var(--txt)}.wb.x:hover{background:#c42b1c;color:#fff}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 14px}.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.hero{display:flex;flex-direction:column;align-items:center;padding:8px 0 14px}
.pw{width:124px;height:124px;border-radius:50%;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s}
.pw svg{width:46px;height:46px;stroke:var(--mut);transition:.25s}
.pw.on{border-color:var(--neon);box-shadow:var(--glow),inset 0 0 18px rgba(57,255,136,.18);background:rgba(57,255,136,.06)}.pw.on svg{stroke:var(--neon);filter:drop-shadow(0 0 6px rgba(57,255,136,.9))}
.pw.ai{border-color:var(--cyan);box-shadow:0 0 6px rgba(79,195,247,.8),0 0 22px rgba(79,195,247,.3)}.pw.ai svg{stroke:var(--cyan)}
.pw.err{border-color:var(--red);box-shadow:0 0 8px rgba(255,77,79,.7)}.pw.err svg{stroke:var(--red)}
.pw.busy{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}
.st{margin-top:14px;font-size:19px;font-weight:600}.st.on{color:var(--neon);text-shadow:var(--glow)}.st.ai{color:var(--cyan)}.st.err{color:var(--red)}
.sub{margin-top:3px;color:var(--mut);text-align:center;max-width:330px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:3px;margin:4px 0 12px}
.seg div{flex:1;text-align:center;padding:7px 4px;border-radius:7px;cursor:pointer;color:var(--mut)}
.seg div.sel{background:rgba(57,255,136,.12);color:var(--neon);box-shadow:inset 0 0 0 1px rgba(57,255,136,.35)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}.card .l{color:var(--mut);font-size:11px}.card .v{font-size:14px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .s{color:var(--mut);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.good{color:var(--neon)}.warn{color:var(--amber)}.bad{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.chip.ok{border-color:rgba(57,255,136,.4);color:var(--neon)}.chip.no{border-color:rgba(255,77,79,.5);color:var(--red)}.chip.mid{border-color:rgba(255,192,72,.45);color:var(--amber)}
.row{display:flex;gap:6px;margin-bottom:12px}.btn{flex:1;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);cursor:pointer;font:inherit}.btn:hover{border-color:rgba(57,255,136,.45);color:var(--neon)}
.btn.p{background:rgba(57,255,136,.12);border-color:rgba(57,255,136,.45);color:var(--neon)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between}summary::after{content:"›
